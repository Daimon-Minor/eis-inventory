name: Build EIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore if provided
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=${{ secrets.KS_PASS }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KS_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KS_ALIAS_PASS }}" >> $GITHUB_ENV
          else
            echo "Tanpa keystore: pakai debug signing (APK tetap bisa dipasang)"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eis-release-apk
          path: app/build/outputs/apk/release/*.apk
